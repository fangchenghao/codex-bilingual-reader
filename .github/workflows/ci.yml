name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: codex-bilingual-reader
          path: build/codex-bilingual-reader.xpi

  macos:
    # The macOS/Linux port is only meaningful if the shell installer and the
    # platform-aware runtime resolution keep working, so exercise them on Darwin.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Shell installer is syntactically valid and executable
        run: |
          bash -n scripts/install-preserved-pdf-runtime.sh
          test -x scripts/install-preserved-pdf-runtime.sh
      - name: Runtime resolution reports a stable result off Windows
        run: |
          node --input-type=module -e '
            import { resolvePdfRuntime } from "./scripts/pdf-runtime-paths.mjs";
            const runtime = await resolvePdfRuntime({
              root: process.cwd(),
              env: { CODEX_PDF_ENGINE: "/opt/venv/bin/pdf2zh_next", CODEX_PDF_PYTHON: "/opt/venv/bin/python3" },
            });
            if (runtime.mode !== "custom" || !runtime.engine.endsWith("pdf2zh_next")) {
              throw new Error("unexpected runtime resolution: " + JSON.stringify(runtime));
            }
            console.log("runtime resolution ok", runtime.mode, runtime.engine);
          '
      - name: Launcher preflight either reports ready or names the missing engine
        run: |
          status=0
          node scripts/translate-preserved-pdf-cli.mjs --check > /tmp/launcher-check.log 2>&1 || status=$?
          cat /tmp/launcher-check.log
          if [ "$status" -eq 0 ]; then
            grep -q "RESULT_JSON" /tmp/launcher-check.log
          else
            grep -q "ENOENT" /tmp/launcher-check.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codex-bilingual-reader-macos
          path: build/codex-bilingual-reader.xpi
